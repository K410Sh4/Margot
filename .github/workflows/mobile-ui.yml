name: Testes Mobile Margot
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'mobile-navigation.css'
      - 'store.js'
      - 'catalog-data.js'
      - 'admin.html'
      - 'admin.css'
      - 'admin.js'
      - 'image-optimizer.js'
      - 'docs/FOTOS-GRATIS-FIRESTORE.md'
      - 'site-live.js'
      - 'account.js'
      - 'firebase.json'
      - 'firestore.rules'
      - 'storage.rules'
      - '.firebaserc'
      - 'docs/PAINEL-ADMIN-FIREBASE.md'
      - 'merchandising-data.js'
      - 'merchandising.js'
      - 'docs/PROMOCOES-ESTOQUE.md'
      - 'product-detail.js'
      - 'product-detail.css'
      - 'produto.html'
      - 'header.js'
      - 'mobile-nav.js'
      - 'carousel.js'
      - 'motion.js'
      - 'tests/**'
      - 'playwright.config.cjs'
      - 'package.json'
      - '.github/workflows/mobile-ui.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'mobile-navigation.css'
      - 'store.js'
      - 'catalog-data.js'
      - 'admin.html'
      - 'admin.css'
      - 'admin.js'
      - 'image-optimizer.js'
      - 'docs/FOTOS-GRATIS-FIRESTORE.md'
      - 'site-live.js'
      - 'account.js'
      - 'firebase.json'
      - 'firestore.rules'
      - 'storage.rules'
      - '.firebaserc'
      - 'docs/PAINEL-ADMIN-FIREBASE.md'
      - 'merchandising-data.js'
      - 'merchandising.js'
      - 'docs/PROMOCOES-ESTOQUE.md'
      - 'product-detail.js'
      - 'product-detail.css'
      - 'produto.html'
      - 'header.js'
      - 'mobile-nav.js'
      - 'carousel.js'
      - 'motion.js'
      - 'tests/**'
      - 'playwright.config.cjs'
      - 'package.json'
      - '.github/workflows/mobile-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile
      - name: Capturas da administração (desktop e mobile)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: margot-admin-previews
          path: test-results/admin-*.png
          if-no-files-found: ignore
          retention-days: 7
