name: Testes Margot
on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm test -- --project=${{ matrix.browser }}-reduce --project=${{ matrix.browser }}-no-preference
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: falhas-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
